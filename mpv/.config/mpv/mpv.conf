# Video player. The interface is uosc (AUR mpv-uosc), its colors follow the wallpaper:
# script-opts/uosc.conf is generated by Quickshell (theme_appliers/mpv.py), so it isn't in the repo.

# uosc draws its own controls and progress bar. The AUR package puts it under /usr/share/mpv,
# which mpv doesn't search for scripts and fonts, so both are pointed at explicitly
script=/usr/share/mpv/scripts/uosc
osd-fonts-dir=/usr/share/mpv/fonts
osc=no
osd-bar=no
border=no
osd-font="Geist"
osd-font-size=32

# window
keep-open=yes
autofit-larger=80%x80%
save-position-on-quit=yes
watch-later-options=start,volume,mute,sub-visibility

# playback
hwdec=auto-safe
vo=gpu-next
volume-max=150
screenshot-directory=~/Pictures/Screenshots
screenshot-template="mpv-%F-%P"

# subtitles and audio: Russian first, then English
slang=ru,rus,en,eng
alang=ru,rus,en,eng
sub-auto=fuzzy
sub-font="Geist"
sub-font-size=44
sub-border-size=2
