# Idle does nothing: the screen stays on and unlocked, and the computer never sleeps on its own.
# Lock by hand with Mod+I, suspend with Mod+Shift+I (it locks first, so waking up shows the lock screen).

general {
    # Always unlock in English: switch to layout 0 (us) before locking
    lock_cmd = niri msg action switch-layout 0; qs ipc call lockScreen lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
}
